[package]
name = "poshumim_hwscreen"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["engine"]
# `engine` pulls the whole native pipeline (libwebrtc, WGC, napi). Off => only
# `logic` compiles, for fast cross-platform `cargo test` in per-push CI.
engine = [
    "dep:livekit", "dep:livekit-api", "dep:napi", "dep:napi-derive",
    "dep:tokio", "dep:windows", "dep:log", "dep:env_logger", "dep:anyhow",
]

[dependencies]
livekit = { path = "../livekit", features = ["rustls-tls-native-roots"], optional = true }
livekit-api = { path = "../livekit-api", features = ["rustls-tls-native-roots", "access-token"], optional = true }
napi = { version = "2", default-features = false, features = ["napi8", "tokio_rt"], optional = true }
napi-derive = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
anyhow = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
optional = true
features = [
    "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
]

[build-dependencies]
napi-build = "2"
