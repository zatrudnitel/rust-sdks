[package]
name = "probe4_wgc"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
livekit = { path = "../livekit", features = ["rustls-tls-native-roots"] }
livekit-api = { path = "../livekit-api", features = ["rustls-tls-native-roots", "access-token"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
]
